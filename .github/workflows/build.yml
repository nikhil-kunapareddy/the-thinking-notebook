name: Build

# Every push and pull request builds the app and a .dmg (downloadable from the run's Artifacts).
# Pushing a tag like v0.2.0 also publishes a GitHub Release with the .dmg attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "Building $VERSION"

      - name: Build app (Apple silicon + Intel)
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Check the app
        run: |
          APP="build/The Thinking Notebook.app"
          lipo -archs "$APP/Contents/MacOS/TheThinkingNotebook"
          codesign --verify --deep --strict --verbose=2 "$APP"
          plutil -lint "$APP/Contents/Info.plist"

      - name: Make .dmg
        run: ./scripts/make-dmg.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: TheThinkingNotebook-${{ env.VERSION }}
          path: build/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg \
            --title "The Thinking Notebook $VERSION" \
            --notes-file .github/release-notes.md
